name: Deploy container to Azure ($0)

# Builds the app image, pushes it to GitHub Container Registry (free), and
# deploys it to Azure Container Apps with scale-to-zero. Idle cost is $0; light
# real traffic is covered by the Container Apps monthly free grant.
#
# One-time setup (repository -> Settings):
#   Variables : AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#               (optional) AZURE_LOCATION, AZURE_ENV_NAME, AZURE_RESOURCE_GROUP
#   Secrets   : (optional) SQL_CONNECTION_STRING  — only if the app needs a DB
#   The pushed ghcr.io package must be Public so Container Apps can pull it
#   anonymously on scale-from-zero (no long-lived registry credentials needed).
#   The workflow attempts to flip it public automatically (best-effort).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'infra/free/**'
      - '.github/workflows/azure-free-container.yml'

permissions:
  id-token: write   # OIDC federation -> az login (no stored Azure secrets)
  contents: read
  packages: write   # push image to ghcr.io

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'claims-fnol-free' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-claims-fnol-free' }}

jobs:
  deploy:
    # Skip cleanly until Azure OIDC credentials are configured as repo variables.
    if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image name
        id: img
        run: |
          repo="${{ github.repository }}"
          image="ghcr.io/${repo,,}"
          echo "image=$image"                >> "$GITHUB_OUTPUT"
          echo "ref=$image:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=$image:latest"         >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (free ghcr.io storage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}
            ${{ steps.img.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make image package public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          owner_type=$(gh api "/users/$owner" --jq '.type' || echo User)
          if [ "$owner_type" = "Organization" ]; then
            gh api --method PATCH "/orgs/$owner/packages/container/$pkg/visibility" -f visibility=public
          else
            gh api --method PATCH "/user/packages/container/$pkg/visibility" -f visibility=public
          fi

      - name: Azure login (OIDC — no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App (scale-to-zero, $0)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create -n "$RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

            az deployment group create \
              -g "$RESOURCE_GROUP" \
              -n free-container \
              -f infra/free/main.bicep \
              -p environmentName="$AZURE_ENV_NAME" \
                 location="$AZURE_LOCATION" \
                 containerImage="${{ steps.img.outputs.ref }}" \
                 sqlConnectionString="${{ secrets.SQL_CONNECTION_STRING }}" \
              -o none

            url=$(az deployment group show -g "$RESOURCE_GROUP" -n free-container \
                  --query properties.outputs.appUrl.value -o tsv)
            echo "App URL: $url"
            echo "### Deployed (\$0 scale-to-zero) :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **App URL:** $url"                       >> "$GITHUB_STEP_SUMMARY"
            echo "- **Image:** ${{ steps.img.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
