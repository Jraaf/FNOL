name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22.x'
  BACKEND_PUBLISH: backend/publish
  FRONTEND_PUBLISH: frontend/dist/frontend/browser
  BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/ClaimsModule.sln

      - name: Build
        run: dotnet build backend/ClaimsModule.sln --configuration Release --no-restore

      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.4
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project backend/src/ClaimsModule.Persistence/ClaimsModule.Persistence.csproj \
            --startup-project backend/src/ClaimsModule.Persistence/ClaimsModule.Persistence.csproj \
            --output backend/publish/migrations.sql

      - name: Publish API
        run: dotnet publish backend/src/ClaimsModule.API/ClaimsModule.API.csproj
          --configuration Release --no-build --output ${{ env.BACKEND_PUBLISH }}

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: ${{ env.BACKEND_PUBLISH }}

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: backend/publish/migrations.sql

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx ng build --configuration production
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: ${{ env.FRONTEND_PUBLISH }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && vars.AZURE_BACKEND_APP_NAME != ''
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with: { name: backend, path: backend-out }
      - uses: actions/download-artifact@v4
        with: { name: frontend, path: frontend-out }
      - uses: actions/download-artifact@v4
        with: { name: migrations, path: migrations-out }

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply EF migrations
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: migrations-out/migrations.sql

      - name: Deploy backend (App Service)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          package: backend-out

      - name: Deploy frontend (Static Web App)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: frontend-out
          skip_app_build: true
          skip_api_build: true
