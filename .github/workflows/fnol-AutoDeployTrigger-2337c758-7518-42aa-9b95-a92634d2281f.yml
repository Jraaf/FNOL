name: Trigger auto deployment for fnol

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/fnol-AutoDeployTrigger-2337c758-7518-42aa-9b95-a92634d2281f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FNOL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FNOL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FNOL_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: zero1.azurecr.io
          registryUsername: ${{ secrets.FNOL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FNOL_REGISTRY_PASSWORD }}
          containerAppName: fnol
          resourceGroup: DefaultResourceGroup-CCAN
          imageToBuild: zero1.azurecr.io/fnol:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


