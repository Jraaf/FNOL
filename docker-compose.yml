services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: claims-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ClaimsModule!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - claims-sqldata:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: claims-azurite
    command: azurite-blob --blobHost 0.0.0.0 --loose
    ports:
      - "10000:10000"
    volumes:
      - claims-azurite:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: claims-module:local
    container_name: claims-app
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Override the placeholder appsettings.json values via env vars.
      # ASP.NET Core's IConfiguration treats __ as ":" so this maps to ConnectionStrings:ClaimsDb.
      ConnectionStrings__ClaimsDb: "Server=sqlserver,1433;Database=ClaimsModule;User Id=sa;Password=ClaimsModule!2026;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      ConnectionStrings__Hangfire: ""
      Storage__Provider: "LocalFileSystem"
      Storage__LocalRootPath: "/app/App_Data/uploads"
      # The SPA is same-origin in this single-container build, but keep these so the
      # in-container ng-serve dev workflow still works against this API if needed.
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Cors__AllowedOrigins__1: "http://localhost:4200"
    volumes:
      - claims-uploads:/app/App_Data/uploads

volumes:
  claims-sqldata:
  claims-azurite:
  claims-uploads:
